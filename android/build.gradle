// zplayer for Android: the Allegro-free Zelda Classic player (SDL3 + Vulkan).
// Same Android Gradle plugin as SDL3's own template (third_party/SDL3/android-project).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
