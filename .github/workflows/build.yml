name: Build

# Every push to main builds Windows (x86, x64, ARM64), Android, Linux (x86_64, aarch64), macOS (one universal
# program for Apple Silicon and Intel) and Nintendo Switch. When VERSION holds a number that has no release yet, the
# builds are published as a new GitHub Release. Versions ending in -PRE are built but never published.
# Builds marked experimental (Windows ARM64, Linux aarch64, macOS) can fail without holding back a release; the
# release then simply has no download for them.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'downloads/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86, platform: Win32, label: "Windows, 32-bit", experimental: false }
          - { arch: x64, platform: x64, label: "Windows, 64-bit (x64)", experimental: false }
          # cross-compiled on the x64 machine: built, never run here
          - { arch: arm64, platform: ARM64, label: "Windows on ARM (ARM64)", experimental: true }
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }} -DBISON_EXECUTABLE="$PWD/other/winflex/win_bison.exe" -DFLEX_EXECUTABLE="$PWD/other/winflex/win_flex.exe"

      - name: Build
        run: cmake --build build --config Release --target zplayer zqeditor -- /m /v:minimal /nologo

      - name: Package
        run: |
          $folder = "ZC-$env:VERSION-Vulkan"
          New-Item -ItemType Directory $folder | Out-Null
          Copy-Item packaging\windows\* $folder -Recurse
          (Get-Content "$folder\README.txt") -replace '^Windows, 32-bit$', '${{ matrix.label }}' | Set-Content "$folder\README.txt"
          Copy-Item build\Release\zplayer.exe, build\Release\zqeditor.exe $folder
          Compress-Archive -Path $folder -DestinationPath "ZCZQ-$env:VERSION-Vulkan-Windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: ZCZQ-*-Vulkan-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  android:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Android tools
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          ("y`n" * 12) | & $sdkmanager --licenses | Out-Null
          & $sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-35" | Out-Null

      - name: Collect game data
        run: |
          New-Item -ItemType Directory android-data | Out-Null
          Copy-Item packaging\windows\* android-data -Recurse
          Copy-Item packaging\android\soundfont.sf2 android-data
          "ZPLAYER_DATA_DIR=$PWD\android-data" >> $env:GITHUB_ENV

      - name: Build
        run: android\gradlew.bat -p android assembleDebug --no-daemon

      - name: Name the APK
        run: Copy-Item android\app\build\outputs\apk\debug\app-debug.apk "ZC-$env:VERSION-Vulkan-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ZC-*-Vulkan-Android.apk
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Built against an old glibc on purpose: the result runs on newer distributions too.
    container: debian:11
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, label: "Linux, 64-bit", experimental: false }
          - { arch: aarch64, runner: ubuntu-24.04-arm, label: "Linux, 64-bit ARM (aarch64)", experimental: true }
    steps:
      - name: Install build tools
        run: |
          # Debian 11 has reached end of life: its packages are leaving the normal mirrors
          # (404s), and the image needs its security versions, so use Debian's archive.
          rm -f /etc/apt/sources.list.d/*
          printf '%s\n' 'deb http://archive.debian.org/debian bullseye main' 'deb http://archive.debian.org/debian bullseye-updates main' 'deb http://archive.debian.org/debian-security bullseye-security main' > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build pkg-config \
            flex bison python3 libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libdrm-dev libgbm-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libvulkan-dev

      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZC_ZPLAYER_ONLY=ON -DZC_PORT_SDL=ON

      - name: Build
        run: cmake --build build --target zplayer

      - name: Package
        run: |
          folder="ZC-$VERSION-Vulkan-Linux"
          mkdir "$folder"
          cp -r packaging/windows/. "$folder/"
          cp packaging/linux/README.txt packaging/android/soundfont.sf2 "$folder/"
          sed -i 's/^Linux, 64-bit$/${{ matrix.label }}/' "$folder/README.txt"
          install -m 755 build/zplayer "$folder/zplayer"
          tar -czf "ZC-$VERSION-Vulkan-Linux-${{ matrix.arch }}.tar.gz" "$folder"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ZC-*-Vulkan-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    # One universal program (arm64 and x86_64) for Apple Silicon and Intel Macs, on Apple Silicon.
    # (macos-14 has been retired.)
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Get MoltenVK
        # Vulkan on macOS: the official MoltenVK release, whose macOS library is universal.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh release view --repo KhronosGroup/MoltenVK --json assets -q '.assets[].name' | grep -i macos | grep -i '\.tar' | head -n 1)
          [ -n "$asset" ] || asset=$(gh release view --repo KhronosGroup/MoltenVK --json assets -q '.assets[].name' | grep -i all | grep -i '\.tar' | head -n 1)
          echo "MoltenVK asset: $asset"
          mkdir mvk
          gh release download --repo KhronosGroup/MoltenVK --pattern "$asset" --dir mvk
          tar -xf "mvk/$asset" -C mvk
          dylib=$(find mvk -name libMoltenVK.dylib -path '*macOS*' | head -n 1)
          [ -n "$dylib" ] || dylib=$(find mvk -name libMoltenVK.dylib | head -n 1)
          [ -n "$dylib" ] || { find mvk | head -n 100; echo "no libMoltenVK.dylib"; exit 1; }
          echo "MoltenVK: $dylib ($(lipo -archs "$dylib"))"
          lipo -archs "$dylib" | grep -q arm64 && lipo -archs "$dylib" | grep -q x86_64 || { echo "not universal"; exit 1; }
          echo "MVK_DYLIB=$PWD/$dylib" >> "$GITHUB_ENV"
          license=$(find mvk -maxdepth 4 -iname 'LICENSE*' | head -n 1)
          echo "MVK_LICENSE=$PWD/$license" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZC_ZPLAYER_ONLY=ON -DZC_PORT_SDL=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          cmake --build build --target zplayer --parallel 4
          echo "zplayer: $(lipo -archs build/zplayer)"
          lipo -archs build/zplayer | grep -q arm64 && lipo -archs build/zplayer | grep -q x86_64

      - name: Package
        run: |
          folder="ZC-$VERSION-Vulkan-macOS"
          mkdir "$folder"
          cp -R packaging/windows/. "$folder/"
          cp packaging/macos/README.txt packaging/android/soundfont.sf2 "$folder/"
          install -m 755 build/zplayer "$folder/zplayer"
          cp "$MVK_DYLIB" "$folder/libMoltenVK.dylib"
          [ -f "$MVK_LICENSE" ] && cp "$MVK_LICENSE" "$folder/licenses/MoltenVK.txt"
          tar -czf "ZC-$VERSION-Vulkan-macOS.tar.gz" "$folder"

      - name: Try loading a quest (Apple Silicon, then Intel through Rosetta)
        # Not a pass/fail check: this machine has no real GPU, so a failure here may be the machine's.
        continue-on-error: true
        run: |
          set +e
          cd "ZC-$VERSION-Vulkan-macOS"
          perl -e 'alarm 120; exec @ARGV' ./zplayer -quest-load-check 1st.qst load_arm64.txt; echo "arm64 exit $?"; cat load_arm64.txt || true
          perl -e 'alarm 120; exec @ARGV' arch -x86_64 ./zplayer -quest-load-check 1st.qst load_x86_64.txt; echo "x86_64 exit $?"; cat load_x86_64.txt || true
          tail -n 30 allegro.log || true
          rm -f load_*.txt allegro.log zc.sav

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ZC-*-Vulkan-macOS.tar.gz
          if-no-files-found: error

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build-switch -G Ninja -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake -DCMAKE_BUILD_TYPE=Release -DZC_ZPLAYER_ONLY=ON -DZC_BUILD_ZPLAYER=ON

      - name: Build
        run: cmake --build build-switch --target zplayer_nro

      - name: Package
        run: |
          top="ZC-$VERSION-Vulkan-Switch"
          folder="$top/switch/zplayer"
          mkdir -p "$folder"
          cp -r packaging/windows/. "$folder/"
          cp packaging/switch/README.txt packaging/android/soundfont.sf2 build-switch/zplayer.nro "$folder/"
          cd "$top"
          cmake -E tar cf "../$top.zip" --format=zip switch

      - uses: actions/upload-artifact@v4
        with:
          name: switch
          path: ZC-*-Vulkan-Switch.zip
          if-no-files-found: error

  release:
    needs: [windows, android, linux, macos, switch]
    # Runs even when a build failed: GitHub skips a job whose needs include a failed or cancelled
    # job, continue-on-error or not. The publish step itself checks that every required download
    # is there; an experimental build that failed is simply left out.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          case "$version" in
            *-PRE*) echo "$version is a pre-release; built but not published."; exit 0 ;;
          esac
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to publish."
            exit 0
          fi
          missing=0
          for f in "ZCZQ-$version-Vulkan-Windows-x86.zip" "ZCZQ-$version-Vulkan-Windows-x64.zip" \
                   "ZC-$version-Vulkan-Android.apk" "ZC-$version-Vulkan-Linux-x86_64.tar.gz" "ZC-$version-Vulkan-Switch.zip"; do
            [ -f "dist/$f" ] || { echo "missing required download: $f"; missing=1; }
          done
          [ "$missing" = 0 ] || { echo "not publishing $tag"; exit 1; }
          echo "publishing: $(ls dist | tr '\n' ' ')"
          git archive --format=zip --prefix="ZC-$version-Vulkan-Source/" -o "dist/ZC-$version-Vulkan-Source.zip" HEAD
          gh release create "$tag" dist/* --title "Zelda Classic $version Vulkan" --notes-file packaging/RELEASE_NOTES.md --target "$GITHUB_SHA"
